[project]
name = "butane"
version = "0.1.0"
requires-python = ">=3.10"
authors = [
    { name = "Constantinos Tsakonas", email = "tsakonas.constantinos@gmail.com" }
]
# Pip reads these natively. Pixi imports these as standard PyPI requirements.
dependencies = [
    "scipy",
    "torch>=2.11.0,<3",
    "torchvision>=0.26.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.10"

[tool.pixi.pypi-dependencies]
torch = { version = ">=2.11.0,<3", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = ">=0.26.0", index = "https://download.pytorch.org/whl/cu126" }

[project.optional-dependencies]
test = [
    "pytest",
    "h5py"
]
examples = [
    "matplotlib"
]

[tool.pixi.feature.examples.pypi-dependencies]
model-sitter = { git = "https://github.com/iamtsac/model-sitter.git", extras = ["wandb", "media"] }

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
examples = { features = ["examples"], solve-group = "default" }
